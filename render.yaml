services:
  - type: web
    name: word-game-project
    runtime: node
    plan: free # Change if needed
    buildCommand: npm install --production=false && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: word-game-db
          property: connectionString
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://word-game-project.onrender.com # Change after deployment if different
      - key: PORT
        value: "3001"

databases:
  - name: word-game-db
    plan: free # Change if needed
